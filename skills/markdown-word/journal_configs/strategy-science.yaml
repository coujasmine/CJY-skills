# Strategy Science — INFORMS
# Source: https://pubsonline.informs.org/page/stsc/submission-guidelines
# Cross-references: INFORMS Author Portal (file preparation, ORCID policy)
# Last verified: 2026-05 (user-verified against the live submission page)
#
# Only the values in this file are what build_reference_docx.py and
# postprocess_docx.py act on. The full verified breakdown of hard official
# requirements vs. submission advice lives in
# references/journal-specs/strategy-science.md — read it before submitting.
#
# HARD official format requirements encoded below:
#   - 11-point standard font (Times New Roman is an INFORMS example; any
#     standard serif/sans-serif works)
#   - Double-spaced
#   - 1-inch (2.54 cm) margins
#   - Abstract <= 200 words (ScholarOne Step 1 ceiling is 250; 200 is the safe
#     limit for the manuscript itself)
#   - 3-10 keywords (ScholarOne Step 2)
#   - Double-blind: no author names, institutions, acknowledgments in the
#     manuscript itself (self-cites must be cited neutrally, not removed)
#   - Footnotes/endnotes should be AVOIDED — move content into the body
#   - Tables and figures: continuously numbered, placed AFTER references,
#     cited from the body
#
# NOT encoded here (because they aren't format-spec items):
#   - 35-page all-inclusive cap (manuscript organization choice; if you go
#     over, explain briefly in the cover letter and move bulk to an online
#     supplement / e-companion)
#   - Cover letter disclosures (conflicts, overlap, same-database papers,
#     funding) — handled at submission time in ScholarOne Step 5
#   - ORCID — submitting author must have one (INFORMS policy); all final
#     authors need one before publication
#   - 14-day final-files deadline post-acceptance

name: strategy-science
display_name: Strategy Science
publisher: INFORMS
guideline_url: https://pubsonline.informs.org/page/stsc/submission-guidelines
notes: |
  See references/journal-specs/strategy-science.md for the full hard-vs-soft
  requirements breakdown with citations.

  Section numbering: STS empirical work uses decimal numbering. Pure theory
  essays sometimes go unnumbered — for those, set `headings.numbering: none`.

blind: true

page:
  size: letter
  orientation: portrait
  margin_top_cm: 2.54
  margin_bottom_cm: 2.54
  margin_left_cm: 2.54
  margin_right_cm: 2.54
  line_numbers: true
  line_number_restart: continuous
  page_numbers: true
  page_number_position: bottom_center

body:
  font_name: Times New Roman
  font_size_pt: 11
  line_spacing: 2.0
  space_before_pt: 0
  space_after_pt: 0
  first_line_indent_cm: 0
  alignment: left

headings:
  numbering: decimal
  max_level: 4
  h1:
    font_name: Times New Roman
    font_size_pt: 11
    bold: true
    italic: false
    all_caps: false
    alignment: left
    space_before_pt: 18
    space_after_pt: 12
  h2:
    font_name: Times New Roman
    font_size_pt: 11
    bold: true
    italic: false
    alignment: left
    space_before_pt: 12
    space_after_pt: 6
  h3:
    font_name: Times New Roman
    font_size_pt: 11
    bold: false
    italic: true
    alignment: left
    space_before_pt: 6
    space_after_pt: 3
  h4:
    font_name: Times New Roman
    font_size_pt: 11
    bold: false
    italic: true
    alignment: left
    space_before_pt: 6
    space_after_pt: 0

title_page:
  separate_page: true
  title:
    font_size_pt: 13
    bold: true
    alignment: center
  authors:
    font_size_pt: 11
    alignment: center
  affiliations:
    font_size_pt: 10
    italic: true
    alignment: center

abstract:
  separate_page: true
  word_limit: 200
  heading_text: Abstract
  heading_bold: true
  heading_alignment: left

keywords:
  min_count: 3
  max_count: 10
  separator: "; "
  label: "Keywords: "
  label_bold: true

tables:
  style: apa
  alignment: center
  font_name: Times New Roman
  font_size_pt: 10
  header_bold: true
  cell_padding_pt: 3
  border_top_pt: 1.5
  border_header_bottom_pt: 0.5
  border_bottom_pt: 1.5
  border_other_pt: 0
  caption_position: above
  caption_prefix: "Table"
  caption_separator: ". "
  caption_number_format: arabic
  caption_font_size_pt: 11
  caption_prefix_bold: true
  caption_title_italic: false
  notes:
    label: "Notes."
    label_italic: true
    font_size_pt: 9
    alignment: left
    space_before_pt: 6
  repeat_header_across_pages: true
  allow_row_split: false

figures:
  caption_position: below
  caption_prefix: "Figure"
  caption_separator: ". "
  caption_number_format: arabic
  caption_font_size_pt: 11
  caption_prefix_bold: true
  caption_title_italic: false
  alignment: center

references:
  heading_text: References
  hanging_indent_cm: 1.27
  font_size_pt: 11
  line_spacing: 2.0
  space_after_entry_pt: 0
  style_note: |
    INFORMS author-year style. Reference list alphabetical by first author's
    surname. Final-stage formatting: run the list through the INFORMS reference
    style (the official PDF style guide at
    https://pubsonline.informs.org/pb-assets/INFORMSReferencesStyle.pdf), or
    use a CSL pack that targets INFORMS journals. This skill does not
    auto-format citations.
